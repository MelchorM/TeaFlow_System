[platformio]
default_envs = cashier
src_dir = iot/firmware/platformio
lib_dir = iot/firmware/libraries
core_dir = .tools/platformio

[env]
; Arduino ESP32 2.0.17 and Arduino_GFX 1.4.9 are pinned as a pair.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    bblanchon/ArduinoJson@7.4.2

[env:cashier]

[env:cashier-display-test]
build_flags =
    ${env.build_flags}
    -DTEAFLOW_DISPLAY_TEST=1

; LCDWIKI ES3C35P / DIYMORE 3.5-inch ST77922 QSPI, native USB.
; This is a different PCB from the JC8048W550 cashier.
[env:kitchen]
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTEAFLOW_KITCHEN=1

[env:kitchen-display-test]
build_unflags = ${env:kitchen.build_unflags}
build_flags =
    ${env:kitchen.build_flags}
    -DTEAFLOW_DISPLAY_TEST=1
